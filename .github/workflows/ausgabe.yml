name: Wochenausgabe bauen

on:
  push:
    branches: [main]
    paths: ["data/**", "build/**", "ads/**", "img/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright installieren
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Ausgabe bauen (Wetter, Bilder, PNG)
        run: python build/build.py --wetter --fonts --bilder --png
      - name: Ergebnis speichern
        run: |
          git config user.name "gude-laune-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html ausgabe.html ausgabe.png img archiv fonts impressum.html datenschutz.html
          git diff --cached --quiet || git commit -m "Ausgabe aktualisiert [skip ci]"
          git push
